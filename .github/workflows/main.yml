name: Build RTL8188EUS Driver

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex build-essential \
            libssl-dev libelf-dev zip unzip python3

      - name: Download kernel source
        run: ./build.sh getsource

      - name: Download compiler tools
        run: ./build.sh gettools

      - name: Build kernel preparation
        run: ./build.sh startbuild


      - name: Download RTL8188EUS
        run: |
          git clone --depth 1 -b v5.3.9 \
            https://github.com/aircrack-ng/rtl8188eus.git

      
      - name: Prepare kernel configuration
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH"
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip

          make -C common O="$GITHUB_WORKSPACE/out/android11-5.4" ARCH=arm64 qgki_defconfig

          make -C common O="$GITHUB_WORKSPACE/out/android11-5.4" \
            ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- oldconfig </dev/null

          make -C common O="$GITHUB_WORKSPACE/out/android11-5.4" \
            ARCH=arm64 CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-android- \
            CLANG_TRIPLE=aarch64-linux-gnu- modules_prepare


      - name: Compile RTL8188EUS
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$GITHUB_WORKSPACE/gcc/bin:$PATH"
          export CC=clang
          export LD=ld.lld


          cd rtl8188eus
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile

          make ARCH=arm64 \
            CROSS_COMPILE=aarch64-linux-android- \
            KSRC="$GITHUB_WORKSPACE/common O=$GITHUB_WORKSPACE/out/android11-5.4"

          test -f 8188eu.ko

      - name: Upload driver
        uses: actions/upload-artifact@v4
        with:
          name: RTL8188EUS-Driver
          path: rtl8188eus/8188eu.ko
